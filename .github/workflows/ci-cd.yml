# Comprobar → desplegar (vista previa en un PR, producción en main) → release.
# Se compila una vez y se despliega ese mismo artefacto: lo que se probó es lo que se publica.
# Las acciones van fijadas por SHA (la versión, en el comentario).
name: ci-cd
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: '0'
      # Datos del despliegue que enseña la página «Cómo se hace»
      PUBLIC_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PUBLIC_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Tipos (astro check)
        run: npx astro check
      - name: Build
        run: npm run build
      - name: Especificaciones (OpenSpec)
        run: npx -y @fission-ai/openspec@2.1.1 validate --all --strict --no-interactive
      - name: Enlaces internos
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/dist 'dist/**/*.html'
          fail: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitio
          path: dist
          retention-days: 7

  desplegar:
    needs: comprobar
    # Los PR de forks no tienen secretos: no se despliegan
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    environment:
      name: ${{ github.event_name == 'push' && 'produccion' || 'vista-previa' }}
      url: ${{ github.event_name == 'push' && 'https://alejandroduenasreal.me' || steps.cf.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sitio
          path: dist
      - name: Desplegar en Cloudflare Pages
        id: cf
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.166.0'
          command: >-
            pages deploy dist --project-name=alejandroduenasreal
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}
      - name: Comentar la vista previa en el PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ALIAS: ${{ steps.cf.outputs.pages-deployment-alias-url }}
          URL: ${{ steps.cf.outputs.deployment-url }}
        run: |
          cuerpo="Vista previa: ${ALIAS:-$URL} (commit ${SHA::7})"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$cuerpo" --edit-last \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$cuerpo"

  release:
    needs: desplegar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Crear la release con notas generadas
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" --repo "$GITHUB_REPOSITORY" --generate-notes --target "$GITHUB_SHA"
