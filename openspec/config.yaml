schema: spec-driven

context: |
  ## Idioma y estilo
  Todos los artefactos en español (es-ES). En inglés solo los encabezados estructurales de OpenSpec,
  las palabras SHALL/MUST, los ids de cambio, las rutas y el código.

  ## El proyecto
  Web personal de Alejandro Dueñas Real (alejandroduenasreal.me): diseña y opera agentes de IA en
  producción (LLMOps y plataforma). Astro 6 estático + Tailwind 4, sin backend. Toda la web en español:
  portada en / y blog en src/content/blog/ con una entrada por semana ISO (el build falla si hay dos). Todo el texto de la portada vive en src/data/perfil.ts. Página «Cómo se hace» en /como-se-hace/
  que enseña el circuito de especificación, CI y despliegue con datos reales.
  Diseño: composición basada en «Graphic Designer Portfolio Homepage» de Can Aydın (atribución obligatoria),
  rasgo propio de impresión risográfica (trama de puntos). Noche por defecto, modo día.
  Audiencia: reclutadores y responsables técnicos de equipos de IA y plataforma.

  ## Reglas de contenido
  - Solo hechos comprobables. No inventar logros, cifras, empleos, testimonios ni certificados.
    Lo pendiente se declara como pendiente.
  - Del empleador actual (Pangeanic) se dice el nombre, pero ni sus productos, ni sus webs, ni sus clientes,
    ni capturas. De clientes y proyectos, solo FTChart y Vaquify pueden nombrarse.
  - Cifras solo si también están en el CV de LinkedIn en español (incluido «6 equipos y más de 15 personas» en Viajando),
    o si las calcula el build a partir de datos públicos de este repositorio (sección «Medido» de «Cómo se hace»).
  - El puesto actual es el del CV y no se pone ciudad. Nunca teléfono, secretos ni datos de clientes.

  ## Git
  - main protegida; una rama corta y un PR por cambio: feat/<change-id>, fix/<change-id>, chore/<change-id>.
  - Commits convencionales: <tipo>(<ámbito>): <descripción en español>, con el trailer
    OpenSpec-Change: <change-id>.
  - Los agentes nunca fusionan: revisa y fusiona Alejandro, con rebase o merge commit (no squash), en otra sesión,
    nunca en la misma en que se abre el PR. Solo un arreglo urgente de producción, con «urgente» en el título, puede
    fusionarse en la misma sesión.
  - El cambio se archiva en el mismo PR: el último commit es `openspec archive <id> --yes`. No hay PR aparte para archivar.
  - La aprobación de publicar es el merge del PR: queda registrada en GitHub.

rules:
  proposal:
    - Decir qué queda fuera del alcance.
  tasks:
    - Cada tarea dice cómo se comprueba (orden, captura o comportamiento observable).
